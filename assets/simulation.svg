<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t3 d3">
  <title id="t3">Colour-blind simulation split view</title>
  <desc id="d3">A split view: normal vision on the left with a red error tag and green success tag, deuteranopia simulation on the right showing both tags as similar dull yellow, illustrating why colour alone should not carry meaning.</desc>
  <rect width="640" height="300" fill="#F4F5F7"/>
  <rect x="0" y="0" width="320" height="300" fill="#FFFFFF"/>
  <text x="160" y="36" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#1A1D23">Normal vision</text>
  <rect x="60" y="80" width="200" height="40" rx="8" fill="#DC2626"/>
  <text x="160" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#FFFFFF">Error: card declined</text>
  <rect x="60" y="150" width="200" height="40" rx="8" fill="#16A34A"/>
  <text x="160" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#FFFFFF">Success: order placed</text>
  <rect x="320" y="0" width="320" height="300" fill="#EDEDE7"/>
  <text x="480" y="36" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#1A1D23">Deuteranopia simulation</text>
  <rect x="380" y="80" width="200" height="40" rx="8" fill="#9C8A3A"/>
  <text x="480" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#FFFFFF">Error: card declined</text>
  <rect x="380" y="150" width="200" height="40" rx="8" fill="#A69A4E"/>
  <text x="480" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#FFFFFF">Success: order placed</text>
  <line x1="320" y1="0" x2="320" y2="300" stroke="#C7CBD1" stroke-width="2"/>
</svg>
